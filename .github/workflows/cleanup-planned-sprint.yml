name: One-time cleanup Planned Sprint metadata

on:
  push:
    paths:
      - '.github/workflows/cleanup-planned-sprint.yml'

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove migrated Planned Sprint rows from issue metadata
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let updatedCount = 0;

            for await (const response of github.paginate.iterator(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            )) {
              for (const issue of response.data) {
                if (issue.pull_request || !issue.body) continue;

                const nextBody = issue.body.replace(
                  /^\| Planned Sprint \| Sprint [12] \|\r?\n/m,
                  ''
                );

                if (nextBody !== issue.body) {
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: nextBody
                  });
                  updatedCount += 1;
                  core.info(`Updated #${issue.number}`);
                }
              }
            }

            core.notice(`Removed Planned Sprint metadata row from ${updatedCount} issues.`);
